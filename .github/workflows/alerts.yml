name: Alerts

on:
  schedule:
    # Mo–Fr alle 15 Minuten, 8:00 bis 21:45 Uhr deutscher Winterzeit (Sommerzeit: 9:00 bis 22:45 Uhr)
    - cron: "*/15 7-20 * * 1-5"
    # Abschluss nach US-Börsenschluss: 22:30 Uhr Winterzeit
    - cron: "30 21 * * 1-5"
  workflow_dispatch:   # von Hand oder durch den Taktgeber von außen
    inputs:
      still:
        description: "Still: nur melden, wenn es etwas Neues gibt (wie ein geplanter Lauf)"
        type: boolean
        default: false

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Was heute schon gemeldet wurde, damit nichts doppelt kommt
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      # Von Hand gestartet ohne "still": immer melden, auch wenn es nichts Neues gibt (als Funktionstest)
      - run: python alerts.py ${{ github.event_name == 'workflow_dispatch' && !inputs.still && '--always' || '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: mkdir -p state && touch state/sent.json
        if: always()
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: alert-state-${{ hashFiles('state/sent.json') }}
