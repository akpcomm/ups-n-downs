name: Rangliste und App

on:
  schedule:
    # Mo–Fr 23:40 Uhr deutscher Winterzeit (22:40 UTC), nach US-Börsenschluss
    - cron: "40 22 * * 1-5"
  workflow_dispatch:   # zusätzlich von Hand startbar

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Trade-Republic-Liste laden
        run: python -I tr_universe.py
      - name: Neue Kennnummern zuordnen
        run: python isin_map.py US DE IE NL KY IL BM CH LU JE
      - name: Rangliste berechnen
        run: python screener.py
      - name: Daten für die App aufbereiten und Ranking prüfen
        run: python build_site.py --notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cat site/_head.html site/index.html > _site/index.html
          cp site/data.json _site/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
